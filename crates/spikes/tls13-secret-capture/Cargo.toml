[package]
name = "tls13-secret-capture"
description = "Feasibility spike: capture the TLS 1.3 handshake_secret from unmodified rustls via a custom Hkdf provider wrapper."
version = "0.0.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
# rustls is the workspace-locked 0.23.40 with the `ring` backend. This is the
# *same* rustls instance the proxy-mode prover uses, which is the whole point
# of the spike. NOTE: `futures-rustls` (used by `tls-server-fixture`) pulls a
# *separate* rustls 0.22, so it cannot be used for the client here.
rustls = { workspace = true, features = ["std", "ring", "tls12"] }

# Test server fixture (its TLS server runs on rustls 0.22 via futures-rustls;
# the two rustls versions interoperate over the wire just fine).
tls-server-fixture = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
futures = { workspace = true }
# Needed to bridge a tokio stream into the futures-based fixture server, exactly
# as the existing repo tests do (`tokio_util::compat`).
tokio-util = { workspace = true, features = ["compat"] }

# RustCrypto: independent recomputation of the key schedule (NOT the rustls
# delegate), per spike spec §3.2. `hkdf` is not in `[workspace.dependencies]`,
# so it is pinned directly to the version already in `Cargo.lock` (0.12.4).
hkdf = "0.12"
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
